<style>
  :root{
    --bg:#1C1B19; --surface:#242220; --surface-2:#2B2925;
    --text-primary:#EDE9E1; --text-secondary:#A39C8E; --text-muted:#726C60;
    --red:#DB544A; --green:#4F9E71; --gold:#D9A441; --hairline:#3A362F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text-primary);
       font-family:'Noto Sans TC',sans-serif; line-height:1.7;
       -webkit-font-smoothing:antialiased;}
  .page{max-width:640px; margin:0 auto; padding:48px 24px 64px;}
  a{color:inherit;}
  .mono{font-family:'JetBrains Mono',monospace;}
  /* 台股慣例：紅漲綠跌。切勿套用美股配色，會讓人看反方向 */
  .up{color:var(--red);} .down{color:var(--green);}
  hr.divider{border:none; border-top:1px solid var(--hairline); margin:28px 0;}

  .nav{display:flex; gap:18px; font-size:13px; color:var(--text-muted);
       margin-bottom:28px; flex-wrap:wrap;}
  .nav a{text-decoration:none; border-bottom:1px solid transparent; padding-bottom:2px;}
  .nav a:hover,.nav a:focus-visible{color:var(--gold); border-bottom-color:var(--gold);}

  .masthead-label{font-size:13px; color:var(--text-muted); margin-bottom:6px;}
  .masthead-date{font-family:'Noto Serif TC',serif; font-weight:600; font-size:26px;}

  .block h2{font-family:'Noto Serif TC',serif; font-weight:600;
            font-size:20px; margin-bottom:16px;}
  .commentary{font-size:15px; color:var(--text-secondary); line-height:1.8;}

  .tag{font-size:12px; padding:3px 9px; border-radius:100px; white-space:nowrap;}
  .tag.confidence-high{background:rgba(217,164,65,.16); color:var(--gold);}
  .tag.confidence-mid{background:rgba(163,156,142,.16); color:var(--text-secondary);}
  .tag.confidence-low{background:rgba(114,108,96,.16); color:var(--text-muted);}
  .tag.verdict-real{background:rgba(79,158,113,.16); color:var(--green);}
  .tag.verdict-watch{background:rgba(219,84,74,.16); color:var(--red);}
  .tag.watchlist{background:rgba(217,164,65,.2); color:var(--gold);}

  footer.site-footer{margin-top:44px; padding-top:20px;
                     border-top:1px solid var(--hairline);}
  footer.site-footer p{font-size:12.5px; color:var(--text-muted);
                       margin-bottom:6px; line-height:1.6;}

  @media (max-width:480px){
    .page{padding:36px 18px 56px;}
    .masthead-date{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}

  .hero{margin-top:8px; padding-bottom:28px;}
  .hero-eyebrow{font-size:14px; color:var(--text-secondary); margin-bottom:8px;}
  .hero-number{font-family:'JetBrains Mono',monospace; font-size:52px;
               font-weight:500; letter-spacing:-.01em;}
  .hero-change{font-family:'JetBrains Mono',monospace; font-size:18px; margin-left:14px;}
  .hero-stats{display:flex; gap:32px; margin-top:18px; flex-wrap:wrap;}
  .hero-stats .stat-item{display:flex; flex-direction:column; gap:4px;}
  .hero-stats .label{font-size:13px; color:var(--text-muted);}
  .hero-stats .value{font-family:'JetBrains Mono',monospace; font-size:16px;}

  .watch-hits{background:rgba(217,164,65,.08); border-left:2px solid var(--gold);
              border-radius:0 6px 6px 0; padding:14px 18px; margin-bottom:28px;}
  .watch-hits .wh-label{font-size:12.5px; color:var(--gold); margin-bottom:8px;}
  .watch-hits .wh-item{font-size:14.5px; color:var(--text-secondary); margin-bottom:4px;}
  .watch-hits .wh-item strong{color:var(--text-primary); font-weight:500;}

  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr);
             gap:14px 24px; margin-bottom:18px;}
  .stat-grid .stat{display:flex; justify-content:space-between; align-items:baseline;
                   border-bottom:1px solid var(--hairline); padding-bottom:8px;}
  .stat-label{font-size:14px; color:var(--text-secondary);}
  .stat-value{font-family:'JetBrains Mono',monospace; font-size:15px;}

  .inst-row{display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:14px;}
  .inst-row .inst-name{width:56px; color:var(--text-secondary); flex-shrink:0;}
  .inst-row .bar-track{flex:1; height:6px; background:var(--surface-2);
                       border-radius:3px; position:relative; overflow:hidden;}
  .inst-row .bar-fill{position:absolute; top:0; bottom:0; border-radius:3px;}
  .inst-row .bar-fill.up{background:var(--red); left:50%;}
  .inst-row .bar-fill.down{background:var(--green); right:50%;}
  .inst-row .inst-value{width:88px; text-align:right;
                        font-family:'JetBrains Mono',monospace; flex-shrink:0;}

  .theme-entry{border-left:2px solid var(--gold); padding:4px 0 4px 18px; margin-bottom:22px;}
  .theme-entry:last-child{margin-bottom:0;}
  .theme-header{display:flex; justify-content:space-between; align-items:baseline;
                gap:12px; margin-bottom:8px; flex-wrap:wrap;}
  .theme-name{font-family:'Noto Serif TC',serif; font-weight:600; font-size:17px;}
  .theme-desc{font-size:14.5px; color:var(--text-secondary); margin-bottom:8px;}
  .theme-meta{display:flex; justify-content:space-between; align-items:center;
              font-size:13.5px; color:var(--text-muted); flex-wrap:wrap; gap:8px;}
  .theme-link{font-size:13px; color:var(--gold); text-decoration:none;
              display:inline-block; margin-top:8px;}
  .theme-link:hover{text-decoration:underline;}

  .darkhorse-entry{background:var(--surface); border-left:2px solid var(--red);
                   border-radius:0 6px 6px 0; padding:16px 18px; margin-bottom:14px;}
  .darkhorse-name{font-family:'Noto Serif TC',serif; font-weight:600;
                  font-size:17px; margin-bottom:10px;}
  .darkhorse-grid{display:grid; grid-template-columns:1fr 1fr;
                  gap:8px 20px; font-size:13.5px; margin-bottom:12px;}
  .darkhorse-grid .dh-label{color:var(--text-muted);}
  .darkhorse-grid .dh-value{font-family:'JetBrains Mono',monospace;}
  .darkhorse-note{font-size:13.5px; color:var(--text-secondary);
                  border-top:1px solid var(--hairline); padding-top:10px;}

  .tech-table{width:100%; border-collapse:collapse;}
  .tech-table th{text-align:left; font-size:12.5px; font-weight:400;
                 color:var(--text-muted); padding-bottom:10px;
                 border-bottom:1px solid var(--hairline);}
  .tech-table td{padding:12px 0; border-bottom:1px solid var(--hairline);
                 font-size:14.5px; vertical-align:top;}
  .tech-table tr:last-child td{border-bottom:none;}
  .signal-bull{color:var(--red);} .signal-warn{color:var(--gold);}
  .signal-neutral{color:var(--text-secondary);} .signal-bear{color:var(--green);}
  .t-note{color:var(--text-muted); font-size:13px;}

  .call-item{display:flex; justify-content:space-between; gap:12px;
             padding:10px 0; border-bottom:1px solid var(--hairline); font-size:14px;}
  .call-item:last-child{border-bottom:none;}
  .call-note{color:var(--text-muted); font-size:13px;}

  .chart-wrap{margin:12px 0 4px;}
  .theme-kw{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .theme-kw span{font-size:11.5px; color:var(--text-muted);
                 background:var(--surface-2); border-radius:100px; padding:2px 9px;}
  .theme-signal{font-size:13px; color:var(--text-secondary); margin-top:6px;}
  .conf-spark{margin-top:6px;}

  .weekly-box{background:var(--surface); border-radius:8px; padding:20px 22px; margin-bottom:28px;}
  .weekly-box .wb-label{font-size:12.5px; color:var(--gold); margin-bottom:10px;}
  .weekly-box .wb-headline{font-family:'Noto Serif TC',serif; font-size:18px;
                           font-weight:600; margin-bottom:12px;}
  .weekly-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px 20px;
               font-size:13.5px; margin-bottom:8px;}
  .weekly-grid .wg-label{color:var(--text-muted);}
  .weekly-grid .wg-value{font-family:'JetBrains Mono',monospace;}

  .idx-card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
                 gap:14px; margin-bottom:24px;}
  .idx-card{background:var(--surface); border-radius:8px; padding:16px 18px;}
  .idx-card-name{font-size:13px; color:var(--text-secondary); margin-bottom:6px;}
  .idx-card-close{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:500;}
  .idx-card-change{font-family:'JetBrains Mono',monospace; font-size:12.5px; margin-top:3px;}
  .idx-card-spark{margin-top:8px; line-height:0;}
  .idx-card-spark svg{width:100%; height:28px;}

  .news-item{padding:10px 0; border-bottom:1px solid var(--hairline); font-size:14px;}
  .news-item:last-child{border-bottom:none;}
  .news-item .news-source{color:var(--text-muted); font-size:12.5px; margin-right:8px;}

  .rank-group-label{font-family:'Noto Serif TC',serif; font-weight:600; font-size:15px;
                    margin:24px 0 4px; padding-top:16px; border-top:1px solid var(--hairline);}
  .rank-group-label:first-of-type{margin-top:0; padding-top:0; border-top:none;}
  .rank-sub{font-size:13px; color:var(--gold); margin:14px 0 8px;}
  .rank-sub:first-child{margin-top:0;}
  .rank-table{width:100%; border-collapse:collapse; margin-bottom:8px;}
  .rank-table td{padding:9px 0; border-bottom:1px solid var(--hairline); font-size:14px;}
  .rank-table tr:last-child td{border-bottom:none;}
  .rank-table td:last-child{text-align:right; font-family:'JetBrains Mono',monospace;}
  .rank-etf-tag{font-size:10.5px; color:var(--text-muted); border:1px solid var(--hairline);
                border-radius:4px; padding:1px 5px; margin-left:6px;}

  @media (max-width:480px){
    .hero-number{font-size:40px;}
    .stat-grid,.darkhorse-grid{grid-template-columns:1fr;}
    .idx-card-grid{grid-template-columns:repeat(2,1fr);}
  }

</style>
